<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>读取本地 JSON 与图片</title>
<style>body{max-width:60rem;margin:auto;padding:1rem;font:1rem/1.5 sans-serif;color:CanvasText;background:Canvas}button,input{font:inherit}button,label{min-height:48px}label{display:block;margin:.5rem 0}img{width:320px;aspect-ratio:16/9;object-fit:contain}[hidden]{display:none!important}pre{white-space:pre-wrap}</style>
<p><a href="https://haneoka.org/">Haneoka</a></p>
<h1>读取本地 JSON 与图片</h1><p>选择 promenade.json 和 garden.svg，再一起加载。</p>
<label>JSON 文件 <input id="json-file" type="file" accept=".json,application/json"></label>
<label>图片文件 <input id="image-file" type="file" accept="image/*,.svg"></label>
<button id="load">加载所选文件</button><button id="cancel" disabled>取消</button><button id="close">关闭读取器</button>
<p id="status" role="status" aria-live="polite">先选择两个文件。</p><h2 id="title"></h2><img id="preview" hidden alt="从所选文件读取的图片"><pre id="output"></pre>
<script type="module">
const by=id=>document.getElementById(id); let loader,controller,generation=0;
async function close(){generation++;controller?.abort();by("preview").hidden=true;by("preview").removeAttribute("src");by("title").textContent="";by("output").textContent="";const old=loader;loader=undefined;await old?.dispose();by("cancel").disabled=true;}
by("load").onclick=async()=>{
  by("load").disabled=true;let current;
  try{
    await close();current=++generation;controller=new AbortController();const signal=controller.signal;by("cancel").disabled=false;by("status").textContent="正在读取…";
    const jsonFile=by("json-file").files[0],imageFile=by("image-file").files[0];
    if(!jsonFile||!imageFile)throw new Error("先选择 JSON 和图片。");
    const {createEmbedLoader,fileDataSource,fileResourceResolver}=await import("https://haneoka.org/embed/core.js");
    signal.throwIfAborted();if(current!==generation)return;
    const files=new Map();
    loader=createEmbedLoader({source:fileDataSource(jsonFile),locale:"fr",maxBytes:1048576,resolveResource:fileResourceResolver(files)});
    const data=await loader.load({signal});
    if(typeof data.background!=="string"||!data.background)throw new Error("JSON 需要 background 素材键。");
    files.set(data.background,imageFile);
    const bytes=await loader.resourceBytes(data.background,{signal});
    const url=await loader.resourceUrl(data.background,{signal});
    if(current!==generation)return;
    by("title").textContent=String(data.title??"");by("output").textContent=JSON.stringify({data,imageBytes:bytes.length},null,2);
    by("preview").src=url;by("preview").hidden=false;await by("preview").decode();
    if(current===generation)by("status").textContent="JSON 与所选图片已加载。";
  }catch(error){if(current===generation){by("status").textContent=`读取失败： ${error.message}`;const failed=loader;loader=undefined;by("preview").removeAttribute("src");by("preview").hidden=true;await failed?.dispose().catch(()=>{});}}
  finally{if(current===generation){by("load").disabled=false;by("cancel").disabled=true;}}
};
by("cancel").onclick=()=>{controller?.abort();};
by("close").onclick=async()=>{await close();by("load").disabled=false;by("status").textContent="读取器已关闭，可以再次加载。";};
window.addEventListener("pagehide",()=>{void close();},{once:true});
</script></html>
